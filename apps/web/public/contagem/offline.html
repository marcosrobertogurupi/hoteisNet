<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Contagem</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0a0f1a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 18px; margin: 0; }
      p { font-size: 14px; color: #94a3b8; margin: 0; max-width: 320px; }
      button {
        margin-top: 12px;
        padding: 12px 20px;
        border: 0;
        border-radius: 14px;
        background: #059669;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <h1>Sem conexão</h1>
    <p>O app de contagem precisa de internet para falar com o sistema. Verifique sua conexão e tente de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
